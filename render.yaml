services:
  - type: web
    name: zdspgc-enroll-connect
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && cd api && npm install && cd .. && npm run build
    startCommand: node api/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_LOCAL_API_URL
        value: ""
      - key: DATABASE_URL
        sync: false   # Set this secret in the Render dashboard
      - key: SUPABASE_URL
        value: "https://ljumvqyecvqnjfloorvi.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false   # Set this secret in the Render dashboard (Project Settings → API → service_role key)
    healthCheckPath: /api/health
